# Full local stack: inference server + A/B demo endpoint.
# `docker compose -f docker/docker-compose.yaml up`
services:
  serve:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    ports: ["8000:8000"]
    volumes:
      - ../adapters:/app/adapters:ro
      - ../config.yaml:/app/config.yaml:ro
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  ab-compare:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serve
    command: ["uvicorn", "src.inference.ab_compare_api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    volumes:
      - ../adapters:/app/adapters:ro
      - ../config.yaml:/app/config.yaml:ro
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
